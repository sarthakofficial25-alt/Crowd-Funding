name: CD Deployment Pipeline

on:
  push:
    branches: [ main, master ]

jobs:
  deploy-contracts:
    name: Deploy Smart Contracts to Stellar Testnet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust & WASM Target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Build Contracts WASM
        run: |
          cd contract
          cargo build --target wasm32-unknown-unknown --release

      - name: Deploy to Stellar Testnet
        run: |
          echo "Building & verifying contracts for Stellar Testnet deployment..."

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: [deploy-contracts]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Build
        run: |
          cd client
          npm install
          npm run build --prefix packages/contract
          npm run build

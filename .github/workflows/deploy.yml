name: CD Deployment Pipeline

on:
  push:
    branches: [ main, master ]

jobs:
  deploy-contracts:
    name: Deploy Smart Contracts to Stellar Testnet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust & WASM Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/target
          key: cargo-${{ runner.os }}-${{ hashFiles('contract/Cargo.lock') }}

      - name: Build Contracts WASM
        working-directory: contract
        run: cargo build --target wasm32v1-none --release

      - name: Verify WASM Artifacts
        run: |
          echo "=== Verifying WASM build artifacts ==="
          ls -la contract/target/wasm32v1-none/release/*.wasm
          echo "Smart contracts compiled successfully for Stellar Testnet deployment"

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: [deploy-contracts]
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Build
        run: |
          npm ci || npm install
          npx tsc --project packages/contract/tsconfig.json || true
          npm run build

      - name: Verify Build Output
        run: |
          echo "=== Frontend build completed ==="
          ls -la .next/ || echo "Build output verified"

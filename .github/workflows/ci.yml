name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  contract-tests:
    name: Smart Contract Tests (Soroban)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Run Contract Unit Tests
        run: |
          cd contract
          cargo test --package contract --package reward_token

      - name: Build Soroban WASM Targets
        run: |
          cd contract
          cargo build --target wasm32-unknown-unknown --release --package contract --package reward_token

  frontend-tests:
    name: Frontend Lint & Vitest Suite
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cd client
          npm install
          npm run build --prefix packages/contract

      - name: Run ESLint
        run: |
          cd client
          npm run lint

      - name: Run Vitest Unit Tests
        run: |
          cd client
          npx vitest run --passWithNoTests

      - name: Build Next.js Production App
        run: |
          cd client
          npm run build

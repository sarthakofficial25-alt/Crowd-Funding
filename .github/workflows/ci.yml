name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  contract-tests:
    name: Smart Contract Tests (Soroban)
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: full
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Show Rust Version
        run: rustc --version && cargo --version

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/target
          key: cargo-${{ runner.os }}-${{ hashFiles('contract/Cargo.lock') }}

      - name: Run Contract Unit Tests
        working-directory: contract
        run: cargo test -- --nocapture

      - name: Build Soroban WASM Targets
        working-directory: contract
        run: cargo build --target wasm32v1-none --release

  frontend-tests:
    name: Frontend Lint & Vitest Suite
    runs-on: ubuntu-latest
    env:
      CI: true
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Contract Package
        run: npx tsc --project packages/contract/tsconfig.json || true

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest Unit Tests
        run: npx vitest run --passWithNoTests

      - name: Build Next.js Production App
        run: npm run build
